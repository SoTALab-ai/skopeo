apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-clone-publish-worker
  labels:
    app.kubernetes.io/name: registry-clone
    app.kubernetes.io/component: publish-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: registry-clone
      app.kubernetes.io/component: publish-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry-clone
        app.kubernetes.io/component: publish-worker
    spec:
      serviceAccountName: registry-clone
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: publish-worker
          image: ghcr.io/sotalab-ai/skopeo:1.25.1
          command: ["skopeo", "registry-clone", "publish-worker"]
          ports:
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: registry-clone-config
          volumeMounts:
            - name: registry-auth
              mountPath: /auth
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: registry-auth
          secret:
            secretName: registry-clone-auth
        - name: tmp
          emptyDir: {}
