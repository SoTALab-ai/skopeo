apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-clone-blob-worker
  labels:
    app.kubernetes.io/name: registry-clone
    app.kubernetes.io/component: blob-worker
spec:
  replicas: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: registry-clone
      app.kubernetes.io/component: blob-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry-clone
        app.kubernetes.io/component: blob-worker
    spec:
      serviceAccountName: registry-clone
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: registry-clone
              app.kubernetes.io/component: blob-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: blob-worker
          image: ghcr.io/sotalab-ai/skopeo:1.25.1
          command: ["skopeo", "registry-clone", "blob-worker"]
          ports:
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: registry-clone-config
          volumeMounts:
            - name: registry-auth
              mountPath: /auth
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: registry-auth
          secret:
            secretName: registry-clone-auth
        - name: tmp
          emptyDir: {}
